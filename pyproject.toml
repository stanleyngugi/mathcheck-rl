[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native-verify"
version = "0.2.0"
description = "Bounded computational-verification harness for RL training of LLMs"
requires-python = ">=3.10"
dependencies = [
    "lean-kernel-verifier>=0.3.1,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "verifiers==0.3.0",
    "datasets>=3,<5",
    "build>=1,<2",
    "setuptools>=84,<85",
    "wheel>=0.48,<0.49",
    "hatchling>=1.32,<1.33",
]

[tool.setuptools.packages.find]
where = ["src"]
