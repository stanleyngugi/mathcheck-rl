[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native-verify"
version = "0.2.1"
description = "MathCheck RL: answer-key-free bounded-math tasks with Lean-checked rewards"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lean-kernel-verifier>=0.3.2,<0.4",
]
license = "MIT"
authors = [
    { name = "Stanley Ngugi" }
]
keywords = ["reinforcement-learning", "lean4", "verifiable-rewards", "mathematics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "verifiers==0.3.0",
    "datasets>=3,<5",
    "build>=1,<2",
    "setuptools>=84,<85",
    "wheel>=0.48,<0.49",
    "hatchling>=1.32,<1.33",
]

[tool.setuptools.packages.find]
where = ["src"]
