[project]
name = "native-verify-seq"
description = "MathCheck RL finite-observation sequence tasks checked by isolated Lean"
tags = ["single-turn", "math", "lean", "verifiable-rewards", "procedural", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Stanley Ngugi" }]
dependencies = [
    "verifiers==0.3.0",
    "datasets>=3,<5",
    "native-verify>=0.2,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["native_verify_seq.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 20
rollouts_per_example = 4
