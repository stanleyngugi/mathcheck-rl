[project]
name = "native-verify-spec"
description = "Answer-key-free bounded specification and complete-certificate RL tasks"
tags = ["single-turn", "math", "lean", "verifiable-rewards", "answer-key-free"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers==0.3.0",
    "datasets>=3,<5",
    "native-verify>=0.2,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["native_verify_spec.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 16
rollouts_per_example = 4
