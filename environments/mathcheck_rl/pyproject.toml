[project]
name = "mathcheck-rl"
description = "Answer-key-free bounded integer-math RL environment with Lean-checked rewards"
readme = "README.md"
tags = ["single-turn", "math", "lean", "verifiable-rewards", "answer-key-free"]
version = "0.1.1"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Stanley Ngugi" }]
dependencies = [
    "verifiers==0.3.0",
    "datasets>=3,<5",
    "lean-kernel-verifier @ git+https://github.com/stanleyngugi/mathcheck-engine.git@742edec6bdb4f7057780fc54e98fb284b76eedcf",
    "native-verify @ git+https://github.com/stanleyngugi/mathcheck-rl.git@d4912c30564e99a3200f77ca7e94a8a3ebe184c7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["mathcheck_rl.py", "pyproject.toml", "README.md"]

[tool.verifiers.eval]
num_examples = 16
rollouts_per_example = 4
